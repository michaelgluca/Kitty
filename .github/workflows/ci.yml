name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package tests
    # The local packages all support macOS, so their tests run on the host. That
    # avoids depending on a particular simulator runtime being present on the runner,
    # which is the usual source of flaky iOS CI.
    #
    # Must be xcode-27: the packages declare swift-tools-version 6.4, and macos-26
    # ships Swift 6.3.3, which refuses to resolve them outright.
    runs-on: xcode-27
    # A hang fails the job here, not after GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test SafetyDomain
        run: swift test --package-path Packages/SafetyDomain

      - name: Test SafetyContent
        run: swift test --package-path Packages/SafetyContent

      - name: Test SafetyUI
        run: swift test --package-path Packages/SafetyUI

      - name: Test SafetyServices
        run: swift test --package-path Packages/SafetyServices

      - name: Build SafetyTesting
        run: swift build --package-path Packages/SafetyTesting

  app:
    name: App build
    # Needs Xcode 27 for the iOS 27 SDK. Verified against actions/runner-images:
    # `xcode-27` (arm64) is the ONLY label carrying Xcode 27. `macos-26` and
    # `macos-latest` both top out at Xcode 26.6 / iOS SDK 26.5, and `xcode-27-xlarge`
    # is a larger runner that is billed even on a public repository.
    #
    # `xcode-27` is still a preview image, so it can change without the GA
    # stability guarantee. The Toolchain step prints what is actually installed, so
    # a future break is diagnosable from the log rather than a mystery.
    runs-on: xcode-27
    # A hang fails the job here, not after GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'ios' || true

      - name: Build for simulator
        # No signing, so no secrets are needed and pull requests from forks work.
        run: |
          xcodebuild \
            -project Kitty.xcodeproj \
            -scheme Kitty \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ui:
    name: UI tests
    # Behaviours only a UI test can prove: each Call button confirms its own service
    # and number; crime reporting is withheld outside the UK (Guideline 1.7); an
    # alert with no contacts opens setup; 999 is always confirmed and offered only
    # in the UK; Test Mode is announced, routes to drama numbers and switches off
    # when the app is left; and removing a contact is confirmed and remembered.
    runs-on: xcode-27
    # A hang fails the job here, not after GitHub's six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Pick a simulator
        # Simulator names differ between runner images, so choose an available
        # iPhone on the newest iOS runtime rather than hard-coding one.
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ') || { echo "No iPhone simulator available on this runner"; exit 1; }
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run UI tests
        # Ad-hoc "sign to run locally", not CODE_SIGNING_ALLOWED=NO: an unsigned build
        # carries no simulator entitlements, so the Keychain refuses it and every
        # trusted-contacts test fails. This needs no certificate or secret, so pull
        # requests from forks still work.
        run: |
          xcodebuild test \
            -project Kitty.xcodeproj \
            -scheme Kitty \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=
