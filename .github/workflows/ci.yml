name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package tests
    # The local packages all support macOS, so their tests run on the host. That
    # avoids depending on a particular simulator runtime being present on the runner,
    # which is the usual source of flaky iOS CI.
    #
    # Must be xcode-27: the packages declare swift-tools-version 6.4, and macos-26
    # ships Swift 6.3.3, which refuses to resolve them outright.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test SafetyDomain
        run: swift test --package-path Packages/SafetyDomain

      - name: Test SafetyContent
        run: swift test --package-path Packages/SafetyContent

      - name: Test SafetyUI
        run: swift test --package-path Packages/SafetyUI

      - name: Build SafetyServices
        run: swift build --package-path Packages/SafetyServices

      - name: Build SafetyTesting
        run: swift build --package-path Packages/SafetyTesting

  app:
    name: App build
    # Needs Xcode 27 for the iOS 27 SDK. Verified against actions/runner-images:
    # `xcode-27` (arm64) is the ONLY label carrying Xcode 27. `macos-26` and
    # `macos-latest` both top out at Xcode 26.6 / iOS SDK 26.5, and `xcode-27-xlarge`
    # is a larger runner that is billed even on a public repository.
    #
    # `xcode-27` is still a preview image, so it can change without the GA
    # stability guarantee. The Toolchain step prints what is actually installed, so
    # a future break is diagnosable from the log rather than a mystery.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'ios' || true

      - name: Build for simulator
        # No signing, so no secrets are needed and pull requests from forks work.
        run: |
          xcodebuild \
            -project Kitty.xcodeproj \
            -scheme Kitty \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
